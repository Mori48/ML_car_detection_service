services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: car_backend
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: car_frontend
    ports:
      - "7860:7860"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend