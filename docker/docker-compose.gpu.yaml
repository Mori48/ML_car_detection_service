services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend.gpu
    environment:
      USE_TENSORRT: "true"
      ENGINE_PATH: /app/engine_cache/best.engine
    volumes:
      - engine_cache:/app/engine_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  engine_cache: